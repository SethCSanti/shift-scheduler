{{define "title"}}Register - Shift Scheduler{{end}}

{{define "content"}}
<h2>Create Account</h2>

<form method="POST" action="/register">
    <div>
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >
    </div>

    <div>
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <div>
        <label for="confirmPassword">Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            required
        >
    </div>

    {{if .ErrorMessage}}
    <div>
        <p>{{.ErrorMessage}}</p>
    </div>
    {{end}}

    {{if .SuccessMessage}}
    <div>
        <p>{{.SuccessMessage}}</p>
    </div>
    {{end}}

    <div>
        <button type="submit">Create Account</button>
    </div>
</form>

<p>
    Already have an account?
    <a href="/login">Login here</a>
</p>
{{end}}
