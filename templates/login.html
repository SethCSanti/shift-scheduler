{{define "title"}}Login - Shift Scheduler{{end}}

{{define "content"}}
<h2>Login</h2>

<form method="POST" action="/login">
    <div>
        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >
    </div>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    {{if .Error}}
    <div>
        <p>{{.Error}}</p>
    </div>
    {{end}}

    <div>
        <button type="submit">Login</button>
    </div>
</form>

<p>
    Don't have an account?
    <a href="/register">Register here</a>
</p>
{{end}}
